name: CI-pipeline03

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

env:
  APP_ENV: test
  APP_NAME: calculator-image

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: pytest --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        with:
          name: Run-tests
          path: test-results.xml

      - name: Check secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "DEMO_SECRET is set"
          else
            echo "DEMO_SECRET is not set"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - run: docker build -t $APP_NAME .

      - run: 'echo "Docker image built successfully: $APP_NAME"'